<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rachel's Closet">
  <!--
    The mark. An interlocking RC in Zilla Slab, the face the wordmark is set in.

    The C is locked through the R: it passes BEHIND the R's bowl at the top and
    IN FRONT of its leg at the bottom. That alternation is the whole trick –
    two letters that merely overlap read as one sitting on the other, and it is
    only the change of order at the second crossing that makes them look woven.
    Mechanically it is the C drawn twice, the second time clipped to the lower
    crossing so it comes out on top there and nowhere else.

    Both letters are outlined paths, not live text, so this renders identically
    with no webfont, no network and no font stack to negotiate: as a favicon, in
    an email, at the centre of a printed QR code, on a machine that has never
    heard of Zilla Slab.

    Geometry is on a 64 grid and is mirrored exactly by app/Console/Commands/
    BuildBrandAssets.php, which renders the .ico and the app icons. Change one,
    run `php artisan brand:build`.
  -->
  <defs>
    <clipPath id="rc-lock">
      <!-- The lower crossing, and only that. -->
      <rect x="26" y="32" width="38" height="32"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="#8257bd"/>

