<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rachels Closet">
  <!--
    One colour, no tile. Inherits currentColor, so it takes the colour of
    whatever it sits in. Note that an SVG loaded through <img> is an isolated
    document and cannot see the page's colour – inline it, or set the colour
    in whatever places it.

    The interlock cannot be done by stacking here, because there is no second
    colour and no background colour to cut a keyline with. Instead both letters
    are one path with fill-rule="evenodd", so the region where they overlap
    cancels out and becomes negative space. The weave reads as a gap rather
    than as a change of order – which is how a single-colour monogram has
    always done it, and it survives being stamped, embroidered or faxed.
  -->
